name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [[ -f "settings.gradle.kts" ]]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [[ -f "sorsproj/settings.gradle.kts" ]]; then
            echo "directory=sorsproj" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find settings.gradle.kts at the repository root or in sorsproj/"
            exit 1
          fi
      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.directory }}" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sors-plus-debug-apk
          path: ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
