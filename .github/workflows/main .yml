name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          settings_file=$(find . -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)
          if [[ -z "$settings_file" ]]; then
            echo "::error::Could not find settings.gradle.kts anywhere in the repository"
            exit 1
          fi
          project_directory=$(dirname "$settings_file")
          echo "directory=${project_directory#./}" >> "$GITHUB_OUTPUT"
      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.directory }}" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sors-plus-debug-apk
          path: ${{ steps.project.outputs.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
